name: Geofabrik Preload

on:
  schedule:
    # ~04:00 UTC, 06:00 locale Europe/Berlin
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      departements:
        description: 'Codes a traiter (ex: 75,77). Vide = tous les departements pending.'
        required: false
        default: ''
      force_france:
        description: 'Telecharger la France entiere au lieu des extraits regionaux'
        type: boolean
        default: false

permissions:
  contents: read

# Deux imports simultanes se battraient pour le meme etat backend.
concurrency:
  group: geofabrik-preload
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install deps
        run: pip install -r etl/requirements.txt

      - name: Disk space before run
        run: df -h /

      # Le script sort immediatement s'il n'y a aucun departement pending :
      # rien n'est telecharge avant cette verification.
      - name: Run ETL
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feel-good-drive.base44.app
          PBF_CACHE_DIR: /tmp/geofabrik
          ETL_DEPARTEMENTS: ${{ inputs.departements }}
          ETL_FORCE_FRANCE: ${{ inputs.force_france }}
        run: python etl/parse_geofabrik.py
