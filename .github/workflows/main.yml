name: Geofabrik Preload

# A PLACEHOLDER dans .github/workflows/geofabrik-etl.yml
# (Le sandbox Base44 ne peut pas ecrire dans .github/workflows/ ; copier ce fichier
#  a la main dans votre depot GitHub puis ajouter le secret GEOSERVICE_KEY.)

on:
  schedule:
    # ~04:00 UTC, 06:00 locale Europe/Berlin
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pyosmium

      - name: Check pending departements
        id: pending
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feel-good-drive.base44.app
        run: |
          python - <<'PY'
          import os, json, urllib.request
          req = urllib.request.Request(
              f"{os.environ['APP_BASE']}/functions/getPendingDepartements",
              headers={'X-Service-Key': os.environ['GEOSERVICE_KEY']})
          data = json.load(urllib.request.urlopen(req))
          n = len(data.get('pending', []))
          print(f"pending_departements={n}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={n}\n")
          PY

      - name: Download Geofabrik France PBF
        if: steps.pending.outputs.count != '0'
        run: |
          if [ ! -f /tmp/france-latest.osm.pbf ]; then
            echo "Downloading Geofabrik France PBF (~5 GB)..."
            curl -L --fail -o /tmp/france-latest.osm.pbf \
              https://download.geofabrik.de/europe/france/france-latest.osm.pbf
          fi
          ls -lh /tmp/france-latest.osm.pbf

      - name: Run ETL parser
        if: steps.pending.outputs.count != '0'
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feel-good-drive.base44.app
          PBF_PATH: /tmp/france-latest.osm.pbf
        run: python .github/etl/parse_geofabrik.py
