name: Geofabrik Preload

# Pousse les cartes OpenStreetMap Geofabrik (Grand Est) vers le serveur
# FeelGood. C'est la source de qualité des KPI (limites, stops, giratoires).
#
# Une fois : secret GitHub GEOSERVICE_KEY = valeur Render FEELGOOD_SERVICE_KEY
# puis Actions → Geofabrik Preload → Run workflow.

on:
  schedule:
    # ~04:00 UTC, 06:00 locale Europe/Berlin
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install osmium

      - name: Detect departements from recent trips
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feelgood-mytf.onrender.com
        run: |
          if [ -z "$GEOSERVICE_KEY" ]; then
            echo "Secret GEOSERVICE_KEY manquant (copier FEELGOOD_SERVICE_KEY depuis Render)"
            exit 1
          fi
          curl -sS -X POST \
            -H "X-Service-Key: $GEOSERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$APP_BASE/api/apps/feelgood/functions/detectDepartementsToPreload" \
            || echo "detectDepartementsToPreload ignore"

      - name: Check pending departements
        id: pending
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feelgood-mytf.onrender.com
        run: |
          python - <<'PY'
          import os, json, urllib.request, sys
          key = os.environ.get('GEOSERVICE_KEY')
          if not key:
              print('GEOSERVICE_KEY manquant')
              sys.exit(1)
          req = urllib.request.Request(
              f"{os.environ['APP_BASE']}/api/apps/feelgood/functions/getPendingDepartements",
              headers={'X-Service-Key': key, 'User-Agent': 'feelgood-etl/1.0'})
          data = json.load(urllib.request.urlopen(req, timeout=60))
          n = len(data.get('pending', []))
          print(f"pending_departements={n} codes={[d.get('code') for d in data.get('pending', [])]}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={n}\n")
          PY

      - name: Download Geofabrik Grand Est PBF
        if: steps.pending.outputs.count != '0'
        run: |
          PBF=/tmp/grand-est-latest.osm.pbf
          if [ ! -f "$PBF" ] || [ "$(stat -c%s "$PBF" 2>/dev/null || echo 0)" -lt 50000000 ]; then
            echo "Downloading Geofabrik Grand Est PBF..."
            curl -L --fail --retry 3 --retry-delay 5 \
              -o "$PBF" \
              https://download.geofabrik.de/europe/france/grand-est-latest.osm.pbf
          fi
          ls -lh "$PBF"
          if head -c 8 "$PBF" | grep -q '<!DO\|<html\|<HTML'; then
            echo "ERROR: fichier telecharge = HTML (mauvaise URL Geofabrik)"; exit 1
          fi

      - name: Run ETL parser
        if: steps.pending.outputs.count != '0'
        env:
          GEOSERVICE_KEY: ${{ secrets.GEOSERVICE_KEY }}
          APP_BASE: https://feelgood-mytf.onrender.com
          PBF_PATH: /tmp/grand-est-latest.osm.pbf
          PBF_URL: https://download.geofabrik.de/europe/france/grand-est-latest.osm.pbf
        run: python .github/etl/parse_geofabrik.py
