name: Demo Pages

# Publie la version statique de demonstration de l'application sur GitHub
# Pages. Le contenu vient de app/demo/demo-snapshot.json, versionne : le build
# n'appelle donc ni backend ni reseau.
#
# Prerequis, une seule fois : Settings > Pages > Source = GitHub Actions.

on:
  push:
    branches:
      - main
      - cursor/import-feelgood-app-cf00
      - cursor/mobile-app-test-460e
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Build demo
        working-directory: app
        # Pages sert le site sous /<depot>/ : la base doit suivre.
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      # enablement active Pages a la premiere execution, pour eviter un
      # reglage manuel dans Settings > Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
