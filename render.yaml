# Production FeelGood : Render Starter (toujours allumé, Francfort) + Postgres.
# ~7 $/mois web + ~6 $/mois base = environ 13 €/mois.
# Ce n'est plus le plan Free (endormissement + données perdues).
#
# Dashboard Render → Blueprint → Sync, ou carte bancaire puis Sync.
# L'URL https://feelgood-mytf.onrender.com/ reste la même.

databases:
  - name: feelgood-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: feelgood
    user: feelgood
    postgresMajorVersion: "16"

services:
  - type: web
    name: feelgood
    runtime: docker
    plan: starter
    region: frankfurt
    branch: cursor/fix-trip-after-drive-592e
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FEELGOOD_SEED
        value: "0"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: FEELGOOD_SERVICE_KEY
        generateValue: true
      - key: GEOFABRIK_SEED_GRAND_EST
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: feelgood-db
          property: connectionString
